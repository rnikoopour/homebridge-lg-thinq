name: Release

# Push a tag matching the package.json version (e.g. v2.1.0) to publish to npm
# and create the GitHub release from that version's CHANGELOG.md section.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm pack
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## $GITHUB_REF_NAME" '/^## /{ if (p) exit } $0 == v { p = 1; next } p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" ./*.tgz --title "$GITHUB_REF_NAME" --notes-file notes.md
