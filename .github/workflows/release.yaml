name: Release

# Push a tag matching the package.json version (e.g. v2.1.0) to publish to npm
# (trusted publishing, no token) and create the GitHub release from that
# version's CHANGELOG.md section.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm pack
      # Trusted publishing: npm authenticates this workflow via GitHub OIDC
      # (configured on npmjs.com), so no token is stored. Needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - name: Publish to npm (skipped if this version is already published)
        run: |
          name=$(node -p "require('./package.json').name"); version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish"
          else
            npm publish --access public
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## $GITHUB_REF_NAME" '/^## /{ if (p) exit } $0 == v { p = 1; next } p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" ./*.tgz --title "$GITHUB_REF_NAME" --notes-file notes.md
